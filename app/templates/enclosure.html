      	<img src="https://tse1.mm.bing.net/th/id/OIP.1QN9rkUC3T3kmbnMfsnBIAHaE8?pid=ImgDet&w=474&h=316&rs=1&o=7&rm=3"

      <div popover id="myPopover">
        Hunger:
        <div class="barbase">
        <div id="myBar" class="bar" style="width:20%">20%</div>
        </div>
        <br>
        <button class="feedBut" onclick="move()">Feed</button>

        <script>
        function move() {
          var elem = document.getElementById("myBar");
          var width = 20;
          var id = setInterval(frame, 10);
          function frame() {
            if (width >= 100) {
              clearInterval(id);
            } else {
              width++;
              elem.style.width = width + '%';
              elem.innerHTML = width * 1  + '%';
            }
          }
        }
        </script>

      </div>
