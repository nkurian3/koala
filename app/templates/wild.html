<html>
  <head>
    <title>WILD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
    <script src="/static/js/script.js" defer></script>
    <style>body { font-family: 'Poppins', sans-serif; }</style>
  </head>

  <body class="min-h-screen bg-cover bg-center bg-no-repeat" style="background-image: url('{{backdrop}}');">

    <!--NAV BAR-->
    <nav class="">
      <div class="bg-gray-800 flex items-center justify-between h-20 p-4">
        <a class="flex items-center" href="/">
          <img src="/static/favicon.ico" alt="icon" class="h-12 w-12 rounded">
        </a>
        <div class="p-5 flex flex-row justify-end space-x-4">
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/">Home</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/profile">Profile</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/rewards">Rewards</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/wild">Wild</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/logout">Logout</a>
          <a class="font-semibold rounded-lg text-white py-3 px-5 shadow-md" href="/customize" style="background-color: {{theme_color}};">🎨</a>
        </div>
      </div>
    </nav>

    <h1 class="text-3xl text-center uppercase my-3 font-bold text-white p-3" style="background-color: {{theme_color}};">Catch the Animals!</h1>

    <div class="pops flex">
      <div class="pop" id="p">
        <span id="close">&times;</span>
        <h1 id="pop-name"></h1><br>
        <p>
          Species: <span id="pop-species"></span><br>
          Health: <span id="pop-health"></span>
          <br>
          <form method="POST" action="/wild">
            <input type="hidden" name="name" id="input-name">
            <input type="hidden" name="species" id="input-species">
            <input type="hidden" name="health" id="input-health">
            <input type="hidden" name="action" value="rescue">
            {% if space %}
              <button value="1" name="newL" id="rescue" type="submit"
                class="font-semibold rounded-lg text-white py-3 px-5 shadow-md mt-2"
                style="background-color: {{theme_color}};">Rescue Animal</button>
            {% endif %}
          </form>
        </p>
      </div>
    </div>

    {% for i in range(anim|length) %}
      <button datatype="" class="moving btn"
        data-name={{names[i]}}
        data-species={{species[i]}}
        data-health={{healths[i]}}>
        <img src={{anim[i]}} alt="animal" class="animals absolute">
      </button>
    {% endfor %}

  </body>
</html>
