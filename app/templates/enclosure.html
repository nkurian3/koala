 <html>
   <head>
     <title>{{n}}'s ENCLOSURE</title>
     <script src="https://cdn.tailwindcss.com/3.4.16"></script>
     <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
     <link rel='stylesheet' href='../static/css/style.css'>
     <script src="/static/js/script2.js" defer></script>
   </head>

  <body class="min-h-screen bg-[url('../static/backdrops/enclosure_backdrop.png')] bg-cover bg-center bg-no-repeat">


     <!--NAV BAR-->
     <nav class = "">
      <div class="bg-gray-800 flex items-center justify-between h-20 p-4">
          <a class="flex items-center" href="/" >
              <img src="/static/favicon.ico" alt="icon" class="h-12 w-12 rounded">
          </a>
          <div class="p-5 flex flex-row justify-end space-x-4">
              <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/" onclick = "loadingScreen()">Home</a>
              <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/profile" onclick = "loadingScreen()">Profile</a>
              <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/rewards" onclick = "loadingScreen()">Rewards</a>
              <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/wild" onclick = "loadingScreen()">Wild</a>
              <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/logout" onclick = "loadingScreen()">Logout</a>
          </div>
      </div>
    </nav>


     <h1 class="text-3xl text-center uppercase my-3 font-bold">{{n}}'s Enclosure</h1>

     <!-- ANIMALS -->

      <button popovertarget="myPopover" class = "moving btn" id = "why" data-r = '{{rInt}}'>
        
      	<img src= {{p}} alt="Button Image" class = "animals animalse absolute">
      </button>

      <div popover id="myPopover">

        <!-- Injury status -->
        <p style="color: {{urgency_color}}; font-weight: 700; font-size: 1rem; margin-bottom: 4px;">
          {{injury.emoji}} {{injury.label}}
        </p>
        <p style="font-size: 0.8rem; color: #555; margin-bottom: 8px;">{{injury.description}}</p>

        Health:
        <div class="barbase">
        <div id="myBar" class="bar" style="{{ strR }}" > {{r}}</div>
        </div>
        <p style="font-size: 0.75rem; color: #888; margin-top: 4px;">Each feed costs {{food_cost}} 🍃 food</p>
        <br>

        <form id="formy" action="/enclosure/{{a}}" method="POST">
          <input type="hidden" name="action" value="feeding" >
          <input type="hidden" name="id" value= {{a}}>

          <button id = "feed" data-c = '{{canFeed}}'>🍃 Feed ({{food_cost}})</button>
        </form>
       

        <form id="formy2" action="/enclosure/{{a}}" method="POST">
        
        <input type="hidden" name="id" value= {{a}}>
        <input type="hidden" name="action" value="releasing">

        <button id = "release" style="display: none;" class="font-semibold bg-transparent rounded-lg text-black hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white">Release Animal</button>
      
        </form>

        

      </div>


      
   </body>
 </html>
