<!DOCTYPE html>
<html>
  <head>
    <title>TRIVIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
    <style>
      body { font-family: 'Poppins', sans-serif; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0px); }
        30%       { transform: translateY(-30px); }
        60%       { transform: translateY(-10px); }
      }
      .dancing { animation: bounce 0.8s ease-in-out infinite; transform-origin: bottom center; }
    </style>
  </head>
  <body class="min-h-screen bg-cover bg-center bg-no-repeat" style="background-image: url('{{backdrop}}');">
    <nav>
      <div class="bg-gray-800/95 backdrop-blur-sm flex items-center justify-between h-20 px-6">
        <a class="flex items-center gap-2" href="/">
          <img src="/static/favicon.ico" alt="icon" class="h-10 w-10 rounded-xl">
          <span class="text-white font-extrabold text-xl tracking-wide hidden sm:block">Koala</span>
        </a>
        <div class="flex flex-row items-center gap-2">
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/">Home</a>
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/profile">Profile</a>
          <a class="font-semibold rounded-xl bg-white text-gray-800 py-2 px-4 text-sm" href="/rewards">Rewards</a>
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/wild">Wild</a>
          <a class="font-semibold bg-white/10 rounded-xl text-white hover:bg-white hover:text-gray-800 py-2 px-4 text-sm transition" href="/logout">Logout</a>
        </div>
      </div>
    </nav>

    <div class="text-center pt-10 pb-4 px-6">
      <h1 class="text-4xl font-extrabold text-white drop-shadow-lg uppercase tracking-wide">🧠 Trivia</h1>
      <p class="text-white/80 mt-1 text-sm font-medium">$30 per correct answer — unlimited plays</p>
    </div>

    <div class="flex items-start justify-center gap-8 mx-6 mt-4 pb-8">
      <div class="flex flex-col items-center justify-end hidden md:flex" style="min-width:120px; height: 260px;">
        <img src="/static/animal_animations/bunny_hover.gif" alt="dancing animal" class="dancing w-24">
      </div>

      <div class="flex-1 max-w-xl flex flex-col gap-4">
        <!-- Balance -->
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl px-6 py-3 flex items-center gap-3 shadow-xl">
          <span class="text-2xl">💰</span>
          <div>
            <p class="text-xs font-bold uppercase text-gray-400 tracking-widest">Balance</p>
            <p class="text-lg font-extrabold text-gray-800">${{money}}</p>
          </div>
        </div>

        <!-- Question -->
        <div class="bg-white/90 backdrop-blur-sm rounded-2xl px-6 py-5 shadow-xl">
          <p class="text-xs font-bold uppercase text-gray-400 tracking-widest mb-2">Question</p>
          <h2 class="font-bold text-gray-800 text-base leading-snug">{{question}}</h2>
        </div>

        <!-- Answers -->
        <form method="POST" action="/trivia">
          <div class="grid grid-cols-2 gap-3">
            {% for ans in answers %}
              <button type="submit" name="answer" value="{{ans}}"
                class="answer-btn font-semibold bg-white/90 text-gray-800 rounded-2xl py-4 px-4 shadow-lg transition-all duration-150 text-left text-sm hover:scale-[1.02]"
                data-color="{{theme_color}}">{{ans}}</button>
            {% endfor %}
          </div>
          <script>
            document.querySelectorAll('.answer-btn').forEach(btn => {
              btn.addEventListener('mouseover', () => { btn.style.backgroundColor = btn.dataset.color; btn.style.color = 'white'; });
              btn.addEventListener('mouseout', () => { btn.style.backgroundColor = ''; btn.style.color = ''; });
            });
          </script>
        </form>

        {% if response %}
          <div class="bg-white/90 backdrop-blur-sm rounded-2xl px-6 py-4 shadow-xl text-center font-bold text-gray-800">{{response}}</div>
        {% endif %}

        <div class="text-center">
          <a href="/rewards" class="inline-block font-bold text-white rounded-xl px-6 py-3 text-sm shadow-lg transition hover:opacity-90" style="background-color: {{theme_color}};">← Back to Rewards</a>
        </div>
      </div>

      <div class="flex flex-col items-center justify-end hidden md:flex" style="min-width:120px; height: 260px;">
        <img src="/static/animal_animations/squirrel_hover.gif" alt="dancing animal" class="dancing w-24" style="animation-delay: 0.4s; transform: scaleX(-1);">
      </div>
    </div>
  </body>
</html>
