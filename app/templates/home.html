<html>
  <head>
    <title>HOME PAGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
  </head>
  <body class="min-h-screen bg-cover bg-center bg-no-repeat" style="background-image: url('{{backdrop}}');">

    <!--NAV BAR-->
    <nav class="">
        <div class="bg-gray-800 flex items-center justify-between h-20 p-4">
            <a class="flex items-center" href="/">
                <img src="/static/favicon.ico" alt="icon" class="h-12 w-12 rounded">
            </a>
            <div class="p-5 flex flex-row justify-end space-x-4">
                <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/">Home</a>
                <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/profile">Profile</a>
                <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/rewards">Rewards</a>
                <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/wild">Wild</a>
                <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/logout">Logout</a>
                <a class="font-semibold rounded-lg text-white py-3 px-5 shadow-md" href="/customize" style="background-color: {{theme_color}};">🎨 Customize</a>
            </div>
        </div>
    </nav>

    <h1 class="text-3xl text-center uppercase my-3 font-bold text-white p-3" style="background-color: {{theme_color}};">Explore Your Enclosures!</h1>

    <div class="grid grid-cols-2 gap-x-4 mx-6">
        <div class="bg-white/80 rounded-2xl my-4 p-4 shadow">
           <h2 class="font-semibold uppercase text-gray-800">Your Balance: ${{money}}</h2>
            <form id="ff" action="/" method="POST">
                <input type="hidden" name="action" value="buyingE">
                <button id="buye" class="font-semibold rounded-lg text-white py-3 px-5 my-2 shadow" style="background-color: {{theme_color}};">Buy Enclosure: $50</button>
            </form>
        </div>

        <div class="bg-white/80 rounded-2xl my-4 p-4 shadow">
            <h2 class="font-semibold uppercase text-gray-800">Food Stock: {{food}}</h2>
            <form id="f" action="/" method="POST">
                <input type="hidden" name="action" value="buyingF">
                <button id="buyf" class="font-semibold rounded-lg text-white py-3 px-5 my-2 shadow" style="background-color: {{theme_color}};">Buy Food: $10</button>
            </form>
        </div>
    </div>

    {% if error %}
        <div class="bg-white/80 rounded-2xl mx-6 p-4 text-red-600 font-semibold shadow" role="alert">
        {{ error | safe }}
        </div>
    {% endif %}

    <div class="bg-white/80 rounded-2xl mx-6 my-4 shadow">
        <table class="w-full table-fixed border-separate border-spacing-x-4">
            {{table|safe}}
        </table>
    </div>

  </body>
</html>
