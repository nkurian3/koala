<!DOCTYPE html>
<html>
  <head>
    <title>Customize</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
    <style>
      @keyframes bounce {
        0%, 100% { transform: translateY(0px); }
        30%       { transform: translateY(-30px); }
        60%       { transform: translateY(-10px); }
      }
      .dancing { animation: bounce 0.8s ease-in-out infinite; transform-origin: bottom center; }

      @keyframes swipeLeft {
        0%   { transform: translateX(0) rotate(0deg); opacity: 1; }
        100% { transform: translateX(-160%) rotate(-20deg); opacity: 0; }
      }
      @keyframes swipeRight {
        0%   { transform: translateX(0) rotate(0deg); opacity: 1; }
        100% { transform: translateX(160%) rotate(20deg); opacity: 0; }
      }
      .swipe-left  { animation: swipeLeft  0.4s ease-in forwards; }
      .swipe-right { animation: swipeRight 0.4s ease-in forwards; }
    </style>
  </head>

  <body class="min-h-screen bg-cover bg-center bg-no-repeat flex flex-col"
        style="background-image: url('{{theme.backdrop}}');">

    <!--NAV BAR-->
    <nav>
      <div class="bg-gray-800 flex items-center justify-between h-20 p-4">
        <a class="flex items-center" href="/">
          <img src="/static/favicon.ico" alt="icon" class="h-12 w-12 rounded">
        </a>
        <div class="p-5 flex flex-row justify-end space-x-4">
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/">Home</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/profile">Profile</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/rewards">Rewards</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/wild">Wild</a>
          <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/logout">Logout</a>
        </div>
      </div>
    </nav>

    <h1 class="text-3xl text-center uppercase my-3 font-bold text-white p-3" style="background-color: {{theme.color}};">Pick Your Theme!</h1>

    <!-- main layout: X | card | check -->
    <div class="flex-1 flex items-center justify-center gap-6 px-4">

      <!-- X button -->
      <form method="POST" action="/customize" id="noForm">
        <input type="hidden" name="action" value="no">
        <input type="hidden" name="idx" value="{{idx}}">
        <button type="button" onclick="swipe('left')"
          class="w-20 h-20 rounded-full bg-white border-4 border-red-400 text-red-400 text-4xl font-bold shadow-xl hover:bg-red-400 hover:text-white transition-colors duration-150">
          ✕
        </button>
      </form>

      <!-- card -->
      <div id="card" class="bg-white/90 rounded-3xl shadow-2xl p-8 flex flex-col items-center gap-5 w-full max-w-sm">

        <!-- theme name + color swatch -->
        <div class="w-full rounded-2xl h-20 flex items-center justify-center shadow-inner"
             style="background-color: {{theme.color}};">
          <span class="text-white font-bold text-2xl">{{theme.name}}</span>
        </div>

        <!-- mini page preview -->
        <div class="w-full rounded-xl overflow-hidden shadow border border-gray-200">
          <!-- fake nav -->
          <div class="bg-gray-800 h-6 w-full"></div>
          <!-- fake heading -->
          <div class="h-8 flex items-center justify-center text-white text-xs font-bold" style="background-color: {{theme.color}};">
            Answer Correctly for $30!
          </div>
          <!-- fake backdrop -->
          <div class="h-24 bg-cover bg-center" style="background-image: url('{{theme.backdrop}}');"></div>
          <!-- fake answer buttons -->
          <div class="grid grid-cols-2 gap-1 p-2 bg-white/80">
            <div class="rounded-lg py-2 text-xs font-semibold text-white text-center" style="background-color: {{theme.color}};">Option A</div>
            <div class="rounded-lg py-2 text-xs font-semibold text-gray-600 text-center bg-gray-100">Option B</div>
            <div class="rounded-lg py-2 text-xs font-semibold text-gray-600 text-center bg-gray-100">Option C</div>
            <div class="rounded-lg py-2 text-xs font-semibold text-gray-600 text-center bg-gray-100">Option D</div>
          </div>
        </div>

        <!-- dancing animals -->
        <div class="flex justify-around w-full">
          <img src="/static/animal_animations/bunny_hover.gif" class="dancing w-16">
          <img src="/static/animal_animations/squirrel_hover.gif" class="dancing w-16" style="animation-delay:0.4s; transform:scaleX(-1);">
        </div>

        <!-- progress dots -->
        <div class="flex gap-2">
          {% for i in range(total) %}
            <div class="w-2 h-2 rounded-full transition-all"
                 style="background-color: {{theme.color}}; opacity: {% if i == idx %}1{% else %}0.3{% endif %};"></div>
          {% endfor %}
        </div>

      </div>

      <!-- check button -->
      <form method="POST" action="/customize" id="yesForm">
        <input type="hidden" name="action" value="yes">
        <input type="hidden" name="idx" value="{{idx}}">
        <button type="button" onclick="swipe('right')"
          class="w-20 h-20 rounded-full bg-white border-4 text-4xl font-bold shadow-xl transition-colors duration-150"
          style="border-color: {{theme.color}}; color: {{theme.color}};"
          onmouseover="this.style.backgroundColor='{{theme.color}}'; this.style.color='white';"
          onmouseout="this.style.backgroundColor='white'; this.style.color='{{theme.color}}';">
          ✓
        </button>
      </form>

    </div>

    <script>
      function swipe(direction) {
        const card = document.getElementById('card');
        card.classList.add(direction === 'left' ? 'swipe-left' : 'swipe-right');
        setTimeout(() => {
          document.getElementById(direction === 'left' ? 'noForm' : 'yesForm').submit();
        }, 380);
      }
    </script>

  </body>
</html>
