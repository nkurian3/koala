<html>

  <head>
    <title>Login</title>

    <link rel="stylesheet" type="text/css" href="/static/css/style.css">
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="icon" href="/static/favicon.png" type="image/png">

  </head>

  <body class="min-h-screen bg-[url('../static/backdrops/registration_backdrop.png')] bg-cover bg-center bg-no-repeat">

    <nav class = "">
      <div class="bg-gray-800 flex items-center justify-between h-20 p-4">
          <a class="flex items-center" href="/" >
              <img src="/static/favicon.ico" alt="icon" class="h-12 w-12 rounded">
          </a>
          <div class="p-5 flex flex-row justify-end space-x-4">
              <a class="font-semibold bg-transparent rounded-lg text-white hover:bg-white hover:text-gray-800 py-3 px-5 shadow-md shadow-white" href="/register" onclick = "loadingScreen()">Register</a>
          </div>
      </div>
    </nav>


  <div class="mx-[5%] my-[2%] flex flex-col items-left">
    <div class="w-[500px] my-5 bg-gray-400 flex flex-col items-center rounded-md">

    <h1 class="text-6xl text-center uppercase mt-5 font-bold">Access Your Account</h1>
    <p class="text-1xl text-center mb-5">Enter your username and password below:</p>

    <form method="POST" action="/login" class="my-3">

        <div class="m-[20px] grid grid-cols-2 items-center">
          <label for="username" class="justify-self-start py-1 px-5 uppercase font-bold text-center bg-gray-500 rounded-lg">USERNAME:</label>
          <input type="text" name="username" id="username" required class="justify-self-end w-50 px-4 py-1 text-lg rounded-xl border border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-600">
        </div>

          <div class="m-[20px] grid grid-cols-2 items-center">
            <label for="password" class="justify-self-start py-1 px-5 uppercase font-bold text-center bg-gray-500 rounded-lg">PASSWORD:</label>
            <input type="password" name="password" id="password" required class="justify-self-end w-50 px-4 py-1 text-lg rounded-xl border border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-600">
          </div>

          <div class="m-[20px] d-grid gap-2">
            <input type="submit" name="sub1" class="font-semibold bg-gray-800 rounded-xl text-white hover:bg-white hover:text-gray-800 py-3 mb-5 px-5 transition" value="Submit">
          </div>

          {% if error %}
          <div class="p-2 m-2 uppercase font-semibold rounded-lg text-white">
          {{ error | safe }}
          </div>
          {% endif %}

        </form>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>

</html>
